openapi: 3.1.1
info:
  title: VORTEX Public Business API
  version: 2.1.0
  description: Public business boundary; HTTP adapters are delivered by plan 06-07.
servers: []
security:
  - bearerAuth: []
paths:
  /api/v1/tenants/{tenant_id}/subscription:
    parameters:
      - {name: tenant_id, in: path, required: true, schema: {type: string, format: uuid}}
    get:
      operationId: getSubscription
      x-vortex-implementation-plan: 06-07
      description: Stored immutable subscription terms and original UTC monthly anchor. Catalog edits affect future issuance only. Traffic is billed as execution bytes multiplied by the immutable path coefficient.
      responses:
        '200': {description: Immutable primary subscription, content: {application/json: {schema: {$ref: '#/components/schemas/PackageResult'}}}}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '422': {$ref: '#/components/responses/InvalidInput'}
        '500': {$ref: '#/components/responses/InternalError'}
  /api/v1/tenants/{tenant_id}/rules/{rule_id}:
    parameters:
      - {name: tenant_id, in: path, required: true, schema: {type: string, format: uuid}}
      - {name: rule_id, in: path, required: true, schema: {type: string, format: uuid}}
    put:
      operationId: reviseRule
      x-vortex-implementation-plan: 06-07
      description: Append an immutable rule revision. If-Match is the expected current revision (0 for creation). Stale writes return RULE_REVISION_CONFLICT. Returns accepted desired state and asynchronous operation; activation is reported separately. Targets and paths remain fixed for each existing session; new sessions may choose another healthy path. Resolved destination addresses are checked at the exit.
      parameters:
        - {name: If-Match, in: header, required: true, schema: {type: string, pattern: '^[0-9]+$'}}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/RuleInput'}
      responses:
        '202':
          description: Immutable desired revision accepted. Impact is hot, rebuild or stop; disruptive changes must be displayed before commit.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/RuleMutationSummary'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/InvalidInput'}
        '422': {$ref: '#/components/responses/InvalidInput'}
        '500': {$ref: '#/components/responses/InternalError'}
  /api/v1/tenants/{tenant_id}/node-groups/{group_id}/serving:
    parameters:
      - {name: tenant_id, in: path, required: true, schema: {type: string, format: uuid}}
      - {name: group_id, in: path, required: true, schema: {type: string, format: uuid}}
    get:
      operationId: getServingMembers
      x-vortex-implementation-plan: 06-07
      description: Current confirmed members and ports only. Restrictions, stale snapshots, offline nodes and unknown or retained reservations exclude service. DNS removal never releases occupation.
      responses:
        '200':
          description: Eligible business addresses.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ServingSummary'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '422': {$ref: '#/components/responses/InvalidInput'}
        '500': {$ref: '#/components/responses/InternalError'}
  /api/v1/tenants/{tenant_id}/node-groups/{group_id}/dns:
    parameters:
      - {name: tenant_id, in: path, required: true, schema: {type: string, format: uuid}}
      - {name: group_id, in: path, required: true, schema: {type: string, format: uuid}}
    post:
      operationId: recomputeGroupDNS
      x-vortex-implementation-plan: 06-07
      description: Recompute DNS from serving state using an enrolled zone access reference. Only the group owner can bind its one persistent domain within the verified zone; subsequent requests must match this binding. Platform groups aggregate all active tenants' committed rules. TTL is fixed at 60 and DNS-only. Unknown results retain occupation and require reconciliation.
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/DNSRecomputeRequest'}
      responses:
        '202':
          description: Accepted desired DNS operation; provider success remains pending.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/DNSOperationSummary'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/InvalidInput'}
        '422': {$ref: '#/components/responses/InvalidInput'}
        '500': {$ref: '#/components/responses/InternalError'}
  /api/v1/tenants/{tenant_id}/port-reservations:
    parameters:
      - {name: tenant_id, in: path, required: true, schema: {type: string, format: uuid}}
    post:
      operationId: preparePortReservation
      x-vortex-implementation-plan: 06-07
      description: Fixed member-set prepare; all matching node confirmations are required before commit. Reallocation after release warns that the entry address may change.
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/PortReservationRequest'}
      responses:
        '202':
          description: Reserved desired allocation; node execution remains pending.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/PortAllocationSummary'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409':
          description: Stale member set, unavailable port or no common port; safe common alternative may be returned as a field error.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ApiError'}
        '422': {$ref: '#/components/responses/InvalidInput'}
        '500': {$ref: '#/components/responses/InternalError'}
  /api/v1/tenants/{tenant_id}/nodes/{node_id}:
    parameters:
      - {name: tenant_id, in: path, required: true, schema: {type: string, format: uuid}}
      - {name: node_id, in: path, required: true, schema: {type: string, format: uuid}}
    get:
      operationId: getNode
      x-vortex-implementation-plan: 06-07
      description: Tenant ownership or currently valid grant is required; platform reads are audited.
      responses:
        '200':
          description: Scoped node business state.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/NodeSummary'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '422': {$ref: '#/components/responses/InvalidInput'}
        '500': {$ref: '#/components/responses/InternalError'}
    patch:
      operationId: transitionNode
      x-vortex-implementation-plan: 06-07
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/NodeTransition'}
      responses:
        '202':
          description: Accepted desired lifecycle; execution and occupation remain receipt-bound.
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '422': {$ref: '#/components/responses/InvalidInput'}
        '500': {$ref: '#/components/responses/InternalError'}
  /api/v1/tenants/{tenant_id}/node-groups/{group_id}:
    parameters:
      - {name: tenant_id, in: path, required: true, schema: {type: string, format: uuid}}
      - {name: group_id, in: path, required: true, schema: {type: string, format: uuid}}
    get:
      operationId: getNodeGroup
      x-vortex-implementation-plan: 06-07
      responses:
        '200':
          description: Authorized group with stable member-set version.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/NodeGroupSummary'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '422': {$ref: '#/components/responses/InvalidInput'}
        '500': {$ref: '#/components/responses/InternalError'}
  /api/v1/tenants/{tenant_id}/restrictions:
    parameters:
      - name: tenant_id
        in: path
        required: true
        schema: {type: string, format: uuid}
    get:
      operationId: listRestrictions
      x-vortex-implementation-plan: 06-07
      x-vortex-collection: true
      parameters:
        - name: cursor
          in: query
          description: Opaque tenant/filter bound cursor; invalid values return 422.
          schema: {type: string, maxLength: 512}
        - name: limit
          in: query
          schema: {type: integer, minimum: 1, maximum: 100, default: 50}
      responses:
        '200':
          description: Active restrictions; all causes must clear before eligibility resumes.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/RestrictionPage'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '422': {$ref: '#/components/responses/InvalidInput'}
        '500': {$ref: '#/components/responses/InternalError'}
  /api/v1/tenants/{tenant_id}/events:
    parameters:
      - name: tenant_id
        in: path
        required: true
        schema: {type: string, format: uuid}
    get:
      operationId: streamTenantEvents
      x-vortex-implementation-plan: 06-07
      parameters:
        - name: Last-Event-ID
          in: header
          schema: {type: string, maxLength: 512}
      x-vortex-sse:
        authority: PostgreSQL
        gap_event: resync
        gap_action: REST-refetch
        event_schema: '#/components/schemas/BusinessEvent'
      responses:
        '200':
          description: Durable authorized hints; resync requires REST refetch.
          content:
            text/event-stream:
              schema: {type: string}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '422': {$ref: '#/components/responses/InvalidInput'}
        '500': {$ref: '#/components/responses/InternalError'}
components:
  responses:
    Unauthorized:
      description: Authentication required.
      content:
        application/json:
          schema: {$ref: '#/components/schemas/ApiError'}
    Forbidden:
      description: Action is not authorized for this tenant.
      content:
        application/json:
          schema: {$ref: '#/components/schemas/ApiError'}
    NotFound:
      description: Resource is not visible in the authorized scope.
      content:
        application/json:
          schema: {$ref: '#/components/schemas/ApiError'}
    InvalidInput:
      description: Input or cursor is invalid.
      content:
        application/json:
          schema: {$ref: '#/components/schemas/ApiError'}
    InternalError:
      description: Request failed; internal details are excluded.
      content:
        application/json:
          schema: {$ref: '#/components/schemas/ApiError'}
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
  schemas:
    PackageTerms:
      type: object
      additionalProperties: false
      required: [price_minor, duration_days, traffic_reset, traffic_bytes, capabilities, rule_limit, rate_limit, connection_limit]
      properties:
        price_minor: {type: integer, minimum: 0}
        duration_days: {type: integer, minimum: 1, maximum: 36500}
        traffic_reset: {type: string, enum: [none, monthly]}
        traffic_bytes: {type: integer, minimum: 0}
        capabilities: {type: array, uniqueItems: true, items: {type: string, enum: [tcp, udp, direct, tunnel, multi_hop, manual_reverse]}}
        rule_limit: {type: integer, minimum: 0}
        rate_limit: {type: integer, minimum: 0}
        connection_limit: {type: integer, minimum: 0}
    PackageResult:
      type: object
      additionalProperties: false
      required: [subscription_id, snapshot_id, source_id, operation_id, version, anchor_at, expires_at]
      properties:
        subscription_id: {type: string}
        snapshot_id: {type: string, format: uuid}
        source_id: {type: string}
        operation_id: {type: string}
        version: {type: integer, minimum: 1}
        anchor_at: {type: string, format: date-time}
        expires_at: {type: string, format: date-time}
    RuleInput:
      type: object
      additionalProperties: false
      required: [id, name, protocol, mode, path, targets, scheduling, proxy_protocol, enabled]
      properties:
        id: {type: string, format: uuid}
        name: {type: string, minLength: 1, maxLength: 128}
        protocol: {type: string, enum: [tcp, udp, tcp_udp]}
        mode: {type: string, enum: [direct, tunnel, multi_hop]}
        port: {type: integer, minimum: 0, maximum: 65535, default: 0}
        path: {type: array, minItems: 1, maxItems: 32, uniqueItems: true, items: {type: string, format: uuid}}
        directions: {type: array, maxItems: 31, items: {type: string, enum: [auto, forward, reverse]}}
        targets:
          type: array
          minItems: 1
          maxItems: 256
          items:
            type: object
            additionalProperties: false
            required: [address, weight, priority]
            properties:
              address: {type: string, minLength: 1, maxLength: 260}
              weight: {type: integer, minimum: 1, maximum: 10000}
              priority: {type: integer, minimum: 0}
        scheduling: {type: string, enum: [weighted_round_robin, primary_backup]}
        proxy_protocol: {type: string, enum: ['off', v1, v2]}
        idle_timeout_seconds: {type: integer, minimum: 10, maximum: 86400, default: 60}
        rate_limit: {type: integer, minimum: 0}
        connection_limit: {type: integer, minimum: 0}
        enabled: {type: boolean}
    RuleMutationSummary:
      type: object
      additionalProperties: false
      required: [rule_id, revision, operation_id, change_class, sync_status]
      properties:
        rule_id: {type: string, format: uuid}
        revision: {type: integer, minimum: 1}
        operation_id: {type: string, format: uuid}
        change_class: {type: string, enum: [hot, rebuild, stop]}
        sync_status: {type: string, enum: [pending, preparing, committing, running, partial, unknown, failed]}
    ServingSummary:
      type: object
      additionalProperties: false
      required: [addresses]
      properties:
        addresses: {type: array, maxItems: 32, uniqueItems: true, items: {type: string}}
    DNSRecomputeRequest:
      type: object
      additionalProperties: false
      required: [access_id, name, idempotency_key]
      properties:
        access_id: {type: string, format: uuid}
        name: {type: string, maxLength: 253}
        idempotency_key: {type: string, minLength: 1, maxLength: 128}
    DNSOperationSummary:
      type: object
      additionalProperties: false
      required: [operation_id, state]
      properties:
        operation_id: {type: string, format: uuid}
        state: {type: string, enum: [pending, leased, running, succeeded, failed, unknown]}
    ApiError:
      type: object
      additionalProperties: false
      required: [code, message, request_id]
      properties:
        code: {type: string}
        message: {type: string}
        request_id: {type: string}
    Restriction:
      type: object
      additionalProperties: false
      required: [cause, source_id, source_version, effective_at]
      properties:
        cause:
          type: string
          enum: [account_suspended, account_banned, package_expired, quota_exhausted, quantity_exceeded, manual]
        source_id: {type: string, maxLength: 128}
        source_version: {type: integer, minimum: 1}
        effective_at: {type: string, format: date-time}
        cleared_at: {type: [string, 'null'], format: date-time}
    RestrictionPage:
      type: object
      additionalProperties: false
      required: [items, next_cursor]
      properties:
        items:
          type: array
          items: {$ref: '#/components/schemas/Restriction'}
        next_cursor: {type: [string, 'null'], maxLength: 512}
    PortReservationRequest:
      type: object
      additionalProperties: false
      required: [rule_id, group_id, member_set_version, listen_address, protocols]
      properties:
        rule_id: {type: string, format: uuid}
        group_id: {type: string, format: uuid}
        member_set_version: {type: string, pattern: '^[a-f0-9]{64}$'}
        listen_address: {type: string, maxLength: 45}
        port: {type: integer, minimum: 0, maximum: 65535, default: 0}
        protocols: {type: array, minItems: 1, maxItems: 2, uniqueItems: true, items: {type: string, enum: [tcp, udp]}}
    PortAllocationSummary:
      type: object
      additionalProperties: false
      required: [id, port, state, member_set_version, entry_address_may_change]
      properties:
        id: {type: string, format: uuid}
        port: {type: integer, minimum: 1, maximum: 65535}
        state: {type: string, enum: [preparing, committed, aborting, retained, releasing, released, aborted, unknown]}
        member_set_version: {type: string, pattern: '^[a-f0-9]{64}$'}
        entry_address_may_change: {type: boolean}
    NodeSummary:
      type: object
      additionalProperties: false
      required: [id, name, region, owner_kind, lifecycle, version]
      properties:
        id: {type: string, format: uuid}
        name: {type: string, minLength: 1, maxLength: 128}
        region: {type: string}
        owner_kind: {type: string, enum: [platform, tenant]}
        lifecycle: {type: string, enum: [pending, online, draining, offline, disabled]}
        version: {type: integer, minimum: 1}
    NodeTransition:
      type: object
      additionalProperties: false
      required: [lifecycle, expected_version]
      properties:
        lifecycle: {type: string, enum: [pending, online, draining, offline, disabled]}
        expected_version: {type: integer, minimum: 1}
        drain_seconds: {type: integer, minimum: 1, maximum: 86400, default: 300}
    NodeGroupSummary:
      type: object
      additionalProperties: false
      required: [id, purpose, scheduling, billing_multiplier_milli, billing_version, member_set_version]
      properties:
        id: {type: string, format: uuid}
        purpose: {type: string, enum: [entry, relay, exit]}
        scheduling: {type: string, enum: [dns, weighted_round_robin, primary_backup]}
        billing_multiplier_milli: {type: integer, minimum: 0}
        billing_version: {type: integer, minimum: 1}
        member_set_version: {type: string, pattern: '^[a-f0-9]{64}$'}
    BusinessEvent:
      type: object
      additionalProperties: false
      required: [id, type, resource_id, revision]
      properties:
        id: {type: string, maxLength: 512}
        type: {type: string, enum: [operation_changed, restriction_changed, resync]}
        resource_id: {type: string, format: uuid}
        revision: {type: integer, minimum: 1}
x-vortex-source:
  requirements: [GEN-007, BE-005]
  status: phase6-contract
  implementation_plan: 06-07
  generator: none
