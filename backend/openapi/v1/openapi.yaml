openapi: 3.1.1
info:
  title: VORTEX Public Business API
  version: 2.2.0
  description: Public business boundary; HTTP adapters are delivered by plan 06-07.
servers: []
security:
  - bearerAuth: []
paths:
  /api/v1/billing-snapshots/{snapshot_id}/explanation:
    parameters:
      - {name: snapshot_id, in: path, required: true, schema: {type: string, format: uuid}}
    get:
      operationId: getBillingExplanation
      x-vortex-implementation-plan: 06-07
      description: Tenant scoped immutable path coefficient and each ordered group multiplier. Historical snapshots are never recalculated from current configuration. HTTP adapter pending plan 06-07.
      responses:
        '200':
          description: Immutable billing explanation
          content:
            application/json:
              schema: {$ref: '#/components/schemas/BillingExplanation'}
  /api/v1/sources/{source_id}/ledger:
    parameters:
      - {name: source_id, in: path, required: true, schema: {type: string, format: uuid}}
    get:
      operationId: getSourceLedger
      x-vortex-implementation-plan: 06-07
      description: Source local PostgreSQL authority. B, F and L never net across sources. Unknown bounds are frozen occupation, distinct from measured consumption. HTTP adapter pending plan 06-07.
      responses:
        '200':
          description: Rebuildable source projection
          content:
            application/json:
              schema: {$ref: '#/components/schemas/SourceLedger'}
  /api/v1/packages/{package_id}:
    parameters:
      - {name: package_id, in: path, required: true, schema: {type: string, format: uuid}}
    put:
      operationId: putPackageCatalog
      x-vortex-implementation-plan: 06-07
      description: Platform administrator only. If-Match is the current catalog version, 0 for creation. Every edit appends an immutable version; existing subscriptions, sources and billing snapshots retain their stored terms. This operation never charges a payment or renews a subscription.
      parameters:
        - {name: If-Match, in: header, required: true, schema: {type: string, pattern: '^[0-9]+$'}}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [name, terms]
              properties:
                name: {type: string, minLength: 1, maxLength: 128}
                terms: {$ref: '#/components/schemas/PackageTerms'}
      responses:
        '200': {description: Immutable catalog version, content: {application/json: {schema: {$ref: '#/components/schemas/PackageVersion'}}}}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/InvalidInput'}
        '422': {$ref: '#/components/responses/InvalidInput'}
        '500': {$ref: '#/components/responses/InternalError'}
  /api/v1/tenants/{tenant_id}/subscription/preview:
    parameters:
      - {name: tenant_id, in: path, required: true, schema: {type: string, format: uuid}}
    post:
      operationId: previewPackageChange
      x-vortex-implementation-plan: 06-07
      description: Read-only repeatable-read preview; no token, audit, task or rights are issued. The digest pins subscription, immutable catalog version, tenant status, rules, source expirations, port occupation and restriction history. Amounts discarded are issuance upper bounds, never available ledger balances; unknown liability remains frozen.
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/PackageChangeInput'}
      responses:
        '200': {description: Fixed impact for explicit effective time, content: {application/json: {schema: {$ref: '#/components/schemas/PackageChangePreview'}}}}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '422': {$ref: '#/components/responses/InvalidInput'}
        '500': {$ref: '#/components/responses/InternalError'}
  /api/v1/tenants/{tenant_id}/subscription/confirm:
    parameters:
      - {name: tenant_id, in: path, required: true, schema: {type: string, format: uuid}}
    post:
      operationId: confirmPackageChange
      x-vortex-implementation-plan: 06-07
      description: Confirm the exact preview digest and inputs with a non-past effective_at. If-Match is the preview subscription_version. Current actor is rechecked in the transaction and at due execution. Returns a durable pending operation; subscription and restrictions change only at due execution. Stale impact or revoked actor fails the operation without partial changes. Explicit administrative issuance and code-backed confirmation are separate operations; this route consumes no entitlement code.
      parameters:
        - {name: If-Match, in: header, required: true, schema: {type: string, pattern: '^[1-9][0-9]*$'}}
        - {name: Idempotency-Key, in: header, required: true, schema: {type: string, minLength: 1, maxLength: 128}}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/PackageChangeConfirmation'}
      responses:
        '202': {description: Persisted future operation or exact replay, content: {application/json: {schema: {$ref: '#/components/schemas/PackageResult'}}}}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/InvalidInput'}
        '422': {$ref: '#/components/responses/InvalidInput'}
        '500': {$ref: '#/components/responses/InternalError'}
  /api/v1/tenants/{tenant_id}/entitlement-redemptions/preview:
    parameters:
      - {name: tenant_id, in: path, required: true, schema: {type: string, format: uuid}}
    post:
      operationId: previewEntitlementChange
      x-vortex-implementation-plan: 06-07
      description: Preview a package-kind code against an existing primary subscription. Read-only; binds exact code hash, actor, package version, code duration and amount to the complete impact digest. Catalog capabilities and reset policy remain pinned; code duration and amount become immutable grant snapshot terms. Raw codes are never logged or returned.
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/EntitlementChangeInput'}
      responses:
        '200': {description: Code-bound immutable impact, content: {application/json: {schema: {$ref: '#/components/schemas/PackageChangePreview'}}}}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '422': {$ref: '#/components/responses/InvalidInput'}
        '500': {$ref: '#/components/responses/InternalError'}
  /api/v1/tenants/{tenant_id}/entitlement-redemptions/confirm:
    parameters:
      - {name: tenant_id, in: path, required: true, schema: {type: string, format: uuid}}
    post:
      operationId: confirmEntitlementChange
      x-vortex-implementation-plan: 06-07
      description: Lock the exact applicable unrevoked unexpired code and consume one use in the same transaction as redemption, snapshot, pending change, operation, task, outbox and audit. If-Match is the preview subscription_version. The globally unique idempotency key binds actor, code hash, keep_rules, effective_at and digest; exact replay succeeds even after exhaustion. Changed inputs conflict. No early activation. A due change rejected for stale authority retains the consumed redemption; there is no silent refund or reissue.
      parameters:
        - {name: If-Match, in: header, required: true, schema: {type: string, pattern: '^[1-9][0-9]*$'}}
        - {name: Idempotency-Key, in: header, required: true, schema: {type: string, minLength: 1, maxLength: 128}}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/EntitlementChangeConfirmation'}
      responses:
        '202': {description: Consumed code and durable pending operation or exact replay, content: {application/json: {schema: {$ref: '#/components/schemas/PackageResult'}}}}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/InvalidInput'}
        '422': {$ref: '#/components/responses/InvalidInput'}
        '500': {$ref: '#/components/responses/InternalError'}
  /api/v1/tenants/{tenant_id}/entitlement-redemptions:
    parameters:
      - {name: tenant_id, in: path, required: true, schema: {type: string, format: uuid}}
    post:
      operationId: redeemEntitlement
      x-vortex-implementation-plan: 06-07
      description: Redeem a code in one transaction. Idempotency-Key is globally bound to tenant and code hash; exact replay returns the stored result. Different-package codes require a confirmed downgrade preview. Codes are excluded from audit and task data. Monthly renewal extends time only; traffic codes create independent sources.
      parameters:
        - {name: Idempotency-Key, in: header, required: true, schema: {type: string, minLength: 1, maxLength: 128}}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [code]
              properties:
                code: {type: string, minLength: 16, maxLength: 256, writeOnly: true}
      responses:
        '200': {description: Issued or exactly replayed result, content: {application/json: {schema: {$ref: '#/components/schemas/PackageResult'}}}}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/InvalidInput'}
        '422': {$ref: '#/components/responses/InvalidInput'}
        '500': {$ref: '#/components/responses/InternalError'}
  /api/v1/tenants/{tenant_id}/subscription:
    parameters:
      - {name: tenant_id, in: path, required: true, schema: {type: string, format: uuid}}
    get:
      operationId: getSubscription
      x-vortex-implementation-plan: 06-07
      description: Stored immutable subscription terms and original UTC monthly anchor. Catalog edits affect future issuance only. Traffic is billed as execution bytes multiplied by the immutable path coefficient.
      responses:
        '200': {description: Immutable primary subscription and stored terms, content: {application/json: {schema: {$ref: '#/components/schemas/SubscriptionSummary'}}}}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '422': {$ref: '#/components/responses/InvalidInput'}
        '500': {$ref: '#/components/responses/InternalError'}
  /api/v1/tenants/{tenant_id}/rules/{rule_id}:
    parameters:
      - {name: tenant_id, in: path, required: true, schema: {type: string, format: uuid}}
      - {name: rule_id, in: path, required: true, schema: {type: string, format: uuid}}
    put:
      operationId: reviseRule
      x-vortex-implementation-plan: 06-07
      description: Append an immutable rule revision. If-Match is the expected current revision (0 for creation). Stale writes return RULE_REVISION_CONFLICT. Returns accepted desired state and asynchronous operation; activation is reported separately. Targets and paths remain fixed for each existing session; new sessions may choose another healthy path. Resolved destination addresses are checked at the exit.
      parameters:
        - {name: If-Match, in: header, required: true, schema: {type: string, pattern: '^[0-9]+$'}}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/RuleInput'}
      responses:
        '202':
          description: Immutable desired revision accepted. Impact is hot, rebuild or stop; disruptive changes must be displayed before commit.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/RuleMutationSummary'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/InvalidInput'}
        '422': {$ref: '#/components/responses/InvalidInput'}
        '500': {$ref: '#/components/responses/InternalError'}
  /api/v1/tenants/{tenant_id}/node-groups/{group_id}/serving:
    parameters:
      - {name: tenant_id, in: path, required: true, schema: {type: string, format: uuid}}
      - {name: group_id, in: path, required: true, schema: {type: string, format: uuid}}
    get:
      operationId: getServingMembers
      x-vortex-implementation-plan: 06-07
      description: Current confirmed members and ports only. Restrictions, stale snapshots, offline nodes and unknown or retained reservations exclude service. DNS removal never releases occupation.
      responses:
        '200':
          description: Eligible business addresses.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ServingSummary'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '422': {$ref: '#/components/responses/InvalidInput'}
        '500': {$ref: '#/components/responses/InternalError'}
  /api/v1/tenants/{tenant_id}/node-groups/{group_id}/dns:
    parameters:
      - {name: tenant_id, in: path, required: true, schema: {type: string, format: uuid}}
      - {name: group_id, in: path, required: true, schema: {type: string, format: uuid}}
    post:
      operationId: recomputeGroupDNS
      x-vortex-implementation-plan: 06-07
      description: Recompute DNS from serving state using an enrolled zone access reference. Only the group owner can bind its one persistent domain within the verified zone; subsequent requests must match this binding. Platform groups aggregate all active tenants' committed rules. TTL is fixed at 60 and DNS-only. Unknown results retain occupation and require reconciliation.
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/DNSRecomputeRequest'}
      responses:
        '202':
          description: Accepted desired DNS operation; provider success remains pending.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/DNSOperationSummary'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/InvalidInput'}
        '422': {$ref: '#/components/responses/InvalidInput'}
        '500': {$ref: '#/components/responses/InternalError'}
  /api/v1/tenants/{tenant_id}/port-reservations:
    parameters:
      - {name: tenant_id, in: path, required: true, schema: {type: string, format: uuid}}
    post:
      operationId: preparePortReservation
      x-vortex-implementation-plan: 06-07
      description: Fixed member-set prepare; all matching node confirmations are required before commit. Reallocation after release warns that the entry address may change.
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/PortReservationRequest'}
      responses:
        '202':
          description: Reserved desired allocation; node execution remains pending.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/PortAllocationSummary'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409':
          description: Stale member set, unavailable port or no common port; safe common alternative may be returned as a field error.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ApiError'}
        '422': {$ref: '#/components/responses/InvalidInput'}
        '500': {$ref: '#/components/responses/InternalError'}
  /api/v1/tenants/{tenant_id}/nodes/{node_id}:
    parameters:
      - {name: tenant_id, in: path, required: true, schema: {type: string, format: uuid}}
      - {name: node_id, in: path, required: true, schema: {type: string, format: uuid}}
    get:
      operationId: getNode
      x-vortex-implementation-plan: 06-07
      description: Tenant ownership or currently valid grant is required; platform reads are audited.
      responses:
        '200':
          description: Scoped node business state.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/NodeSummary'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '422': {$ref: '#/components/responses/InvalidInput'}
        '500': {$ref: '#/components/responses/InternalError'}
    patch:
      operationId: transitionNode
      x-vortex-implementation-plan: 06-07
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/NodeTransition'}
      responses:
        '202':
          description: Accepted desired lifecycle; execution and occupation remain receipt-bound.
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '422': {$ref: '#/components/responses/InvalidInput'}
        '500': {$ref: '#/components/responses/InternalError'}
  /api/v1/tenants/{tenant_id}/node-groups/{group_id}:
    parameters:
      - {name: tenant_id, in: path, required: true, schema: {type: string, format: uuid}}
      - {name: group_id, in: path, required: true, schema: {type: string, format: uuid}}
    get:
      operationId: getNodeGroup
      x-vortex-implementation-plan: 06-07
      responses:
        '200':
          description: Authorized group with stable member-set version.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/NodeGroupSummary'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '422': {$ref: '#/components/responses/InvalidInput'}
        '500': {$ref: '#/components/responses/InternalError'}
  /api/v1/tenants/{tenant_id}/restrictions:
    parameters:
      - name: tenant_id
        in: path
        required: true
        schema: {type: string, format: uuid}
    get:
      operationId: listRestrictions
      x-vortex-implementation-plan: 06-07
      x-vortex-collection: true
      parameters:
        - name: cursor
          in: query
          description: Opaque tenant/filter bound cursor; invalid values return 422.
          schema: {type: string, maxLength: 512}
        - name: limit
          in: query
          schema: {type: integer, minimum: 1, maximum: 100, default: 50}
      responses:
        '200':
          description: Active restrictions; all causes must clear before eligibility resumes.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/RestrictionPage'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '422': {$ref: '#/components/responses/InvalidInput'}
        '500': {$ref: '#/components/responses/InternalError'}
  /api/v1/tenants/{tenant_id}/events:
    parameters:
      - name: tenant_id
        in: path
        required: true
        schema: {type: string, format: uuid}
    get:
      operationId: streamTenantEvents
      x-vortex-implementation-plan: 06-07
      parameters:
        - name: Last-Event-ID
          in: header
          schema: {type: string, maxLength: 512}
      x-vortex-sse:
        authority: PostgreSQL
        gap_event: resync
        gap_action: REST-refetch
        event_schema: '#/components/schemas/BusinessEvent'
      responses:
        '200':
          description: Durable authorized hints; resync requires REST refetch.
          content:
            text/event-stream:
              schema: {type: string}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '422': {$ref: '#/components/responses/InvalidInput'}
        '500': {$ref: '#/components/responses/InternalError'}
components:
  responses:
    Unauthorized:
      description: Authentication required.
      content:
        application/json:
          schema: {$ref: '#/components/schemas/ApiError'}
    Forbidden:
      description: Action is not authorized for this tenant.
      content:
        application/json:
          schema: {$ref: '#/components/schemas/ApiError'}
    NotFound:
      description: Resource is not visible in the authorized scope.
      content:
        application/json:
          schema: {$ref: '#/components/schemas/ApiError'}
    InvalidInput:
      description: Input or cursor is invalid.
      content:
        application/json:
          schema: {$ref: '#/components/schemas/ApiError'}
    InternalError:
      description: Request failed; internal details are excluded.
      content:
        application/json:
          schema: {$ref: '#/components/schemas/ApiError'}
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
  schemas:
    PackageVersion:
      type: object
      additionalProperties: false
      required: [package_id, version, terms]
      properties:
        package_id: {type: string, format: uuid}
        version: {type: integer, minimum: 1}
        terms: {$ref: '#/components/schemas/PackageTerms'}
    SubscriptionSummary:
      type: object
      additionalProperties: false
      required: [subscription_id, snapshot_id, version, anchor_at, expires_at, terms]
      properties:
        subscription_id: {type: string, format: uuid}
        snapshot_id: {type: string, format: uuid}
        version: {type: integer, minimum: 1}
        anchor_at: {type: string, format: date-time}
        expires_at: {type: string, format: date-time}
        terms: {$ref: '#/components/schemas/PackageTerms'}
    PackageChangeInput:
      type: object
      additionalProperties: false
      required: [package_id, package_version, keep_rules, effective_at]
      properties:
        package_id: {type: string, format: uuid}
        package_version: {type: integer, minimum: 1}
        keep_rules: {type: array, maxItems: 10000, uniqueItems: true, items: {type: string, format: uuid}}
        effective_at: {type: string, format: date-time}
    PackageChangeConfirmation:
      type: object
      additionalProperties: false
      required: [package_id, package_version, keep_rules, effective_at, digest]
      properties:
        package_id: {type: string, format: uuid}
        package_version: {type: integer, minimum: 1}
        keep_rules: {type: array, maxItems: 10000, uniqueItems: true, items: {type: string, format: uuid}}
        effective_at: {type: string, format: date-time}
        digest: {type: string, pattern: '^[0-9a-f]{64}$'}
    EntitlementChangeInput:
      type: object
      additionalProperties: false
      required: [code, keep_rules, effective_at]
      properties:
        code: {type: string, minLength: 16, maxLength: 256, writeOnly: true}
        keep_rules: {type: array, maxItems: 10000, uniqueItems: true, items: {type: string, format: uuid}}
        effective_at: {type: string, format: date-time}
    EntitlementChangeConfirmation:
      type: object
      additionalProperties: false
      required: [code, keep_rules, effective_at, digest]
      properties:
        code: {type: string, minLength: 16, maxLength: 256, writeOnly: true}
        keep_rules: {type: array, maxItems: 10000, uniqueItems: true, items: {type: string, format: uuid}}
        effective_at: {type: string, format: date-time}
        digest: {type: string, pattern: '^[0-9a-f]{64}$'}
    PackageChangePreview:
      type: object
      additionalProperties: false
      required: [digest, package_id, package_version, subscription_version, effective_at, keep_rules, lost_capabilities, invalid_rules, new_restrictions, discarded_amounts, affected_resources]
      properties:
        digest: {type: string, pattern: '^[0-9a-f]{64}$'}
        package_id: {type: string, format: uuid}
        package_version: {type: integer, minimum: 1}
        subscription_version: {type: integer, minimum: 1}
        effective_at: {type: string, format: date-time}
        keep_rules: {type: array, items: {type: string, format: uuid}}
        lost_capabilities: {type: array, items: {type: string}}
        invalid_rules: {type: array, items: {type: string, format: uuid}}
        affected_resources: {type: array, items: {type: string, format: uuid}}
        new_restrictions:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [rule_id, reason]
            properties:
              rule_id: {type: string, format: uuid}
              reason: {type: string, enum: [capability_or_limit_lost, quantity_exceeded]}
        discarded_amounts:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [source_id, issued_amount_upper_bound, disposition]
            properties:
              source_id: {type: string, format: uuid}
              issued_amount_upper_bound: {type: integer, minimum: 0}
              disposition: {type: string, const: expire_source_without_releasing_liability}
        entitlement:
          type: object
          additionalProperties: false
          required: [code_hash, actor_id, duration_days, amount]
          properties:
            code_hash: {type: string, pattern: '^[0-9a-f]{64}$'}
            actor_id: {type: string, format: uuid}
            duration_days: {type: integer, minimum: 1, maximum: 36500}
            amount: {type: integer, minimum: 0}
    PackageTerms:
      type: object
      additionalProperties: false
      required: [price_minor, duration_days, traffic_reset, traffic_bytes, capabilities, rule_limit, rate_limit, connection_limit]
      properties:
        price_minor: {type: integer, minimum: 0}
        duration_days: {type: integer, minimum: 1, maximum: 36500}
        traffic_reset: {type: string, enum: [none, monthly]}
        traffic_bytes: {type: integer, minimum: 0}
        capabilities: {type: array, uniqueItems: true, items: {type: string, enum: [tcp, udp, direct, tunnel, multi_hop, manual_reverse]}}
        rule_limit: {type: integer, minimum: 0}
        rate_limit: {type: integer, minimum: 0}
        connection_limit: {type: integer, minimum: 0}
    PackageResult:
      type: object
      additionalProperties: false
