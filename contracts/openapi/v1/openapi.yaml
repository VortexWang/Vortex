openapi: 3.1.1
info:
  title: VORTEX Public Business API
  version: 1.0.0
  description: Draft API contract sourced from V1.11 GEN-007 and BE-005.
servers: []
paths: {}
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
  schemas:
    ApiError:
      type: object
      required: [code, message]
      properties:
        code: {type: string}
        message: {type: string}
        request_id: {type: string}
    Restriction:
      type: object
      required: [id, kind, active]
      properties:
        id: {type: string, format: uuid}
        kind: {type: string}
        active: {type: boolean}
x-vortex-source:
  requirements: [GEN-007, BE-005]
  status: draft
  unresolved:
    - V1.11 defines REST, SSE and business-model boundaries but does not enumerate endpoint paths, payload schemas, pagination, authentication flows or status codes.
    - Do not expose internal runtime configuration or VLink wire types as public compatibility commitments.
