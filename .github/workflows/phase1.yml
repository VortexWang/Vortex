name: phase1

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.27.3'
          cache: false
      - name: Install locked Protoc for lifecycle compatibility checks
        uses: arduino/setup-protoc@c65c819552d16ad3c9b72d9dfd5ba5237b9c906b # v3.0.0
        with:
          version: "36.2"
          repo-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Validate action pins and common command
        shell: bash
        run: |
          set -euo pipefail
          ! grep -E '^\s*uses:.*@(v|main|master|latest|[0-9]+\.[0-9]+)' .github/workflows/phase1.yml
          grep -F 'make phase1-check' Makefile tools/phase1/check.sh .github/workflows/phase1.yml >/dev/null
      - name: Run shared Phase 1 verification
        run: make phase1-check
      - name: Upload Phase 1 evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: phase1-evidence-${{ github.sha }}
          path: artifacts/phase1
          if-no-files-found: error
