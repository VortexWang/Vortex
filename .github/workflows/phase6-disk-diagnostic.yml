name: phase6-disk-diagnostic
on:
  push:
    branches: [codex/diagnose-phase6-disks]
permissions:
  contents: read
jobs:
  diagnose:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout diagnostic driver
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - name: Compare durable local storage without changing product or budgets
        run: sh tools/phase6/disk_diagnostic.sh "$RUNNER_TEMP/disk-diagnostic"
      - name: Retain diagnostic outcomes including failures
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: phase6-disks-${{ github.sha }}
          path: ${{ runner.temp }}/disk-diagnostic/
          if-no-files-found: error
