name: phase6-storage-diagnostic
on:
  push:
    branches: [codex/diagnose-phase6-storage]
permissions:
  contents: read
jobs:
  diagnose:
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    steps:
      - name: Checkout diagnostic source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - name: Compare durable storage without changing runtime budgets
        env:
          PHASE6_DIAGNOSTIC_CPU_ONLY: '1'
        run: sh tools/phase6/storage_diagnostic.sh "$RUNNER_TEMP/storage-diagnostic"
      - name: Retain diagnostic results including failures
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: phase6-storage-${{ github.sha }}-${{ matrix.runner }}
          path: ${{ runner.temp }}/storage-diagnostic/
          if-no-files-found: error
