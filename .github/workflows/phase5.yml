name: phase5-agent-hub-wave1

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  wave1:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.27.3'
          cache: false
      - name: Run Wave 1 check
        run: make phase5-wave1-check
