name: phase5-agent-hub-wave1

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  wave1:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.27.3'
          cache: false
      - name: Install Protoc
        uses: arduino/setup-protoc@c65c819552d16ad3c9b72d9dfd5ba5237b9c906b # v3.0.0
        with:
          version: "36.2"
          repo-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Install pinned Go Protobuf generators
        run: |
          go install google.golang.org/protobuf/cmd/protoc-gen-go@v1.36.12
          go install google.golang.org/grpc/cmd/protoc-gen-go-grpc@v1.6.2
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
      - name: Run frozen contract and traceability checks
        run: make phase5-contract-check
      - name: Run Wave 1 check
        run: make phase5-wave1-check
      - name: Retain Wave 1 diagnostics
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: phase5-wave1-${{ github.sha }}
          path: artifacts/phase5/wave1/
          if-no-files-found: error
      - name: Run Wave 2 check
        run: make phase5-wave2-check
      - name: Prepare isolated full-disk fixture
        run: |
          sudo mkdir -p /tmp/vortex-full-disk
          sudo mount -t tmpfs -o size=4m,mode=1777 tmpfs /tmp/vortex-full-disk
      - name: Run incremental durable authorization regression
        env:
          VORTEX_TEST_FULL_DISK_DIR: /tmp/vortex-full-disk
        run: make phase5-authorization-check
      - name: Run full Phase 5 recovery gate
        env:
          VORTEX_TEST_FULL_DISK_DIR: /tmp/vortex-full-disk
        run: |
          git ls-files --others --exclude-standard
          make phase5-check
      - name: Verify consolidated evidence manifest
        run: python3 -m unittest discover -s tests/phase5
      - name: Verify node deployment lifecycle
        env:
          PHASE5_DEPLOYMENT_EVIDENCE_DIR: artifacts/phase5/check/deployment
        run: sh tools/phase5/node_deployment_check.sh
      - name: Retain recovery regression evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: phase5-recovery-${{ github.sha }}
          path: artifacts/phase5/check/
          if-no-files-found: error
      - name: Retain authorization regression evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: phase5-authorization-${{ github.sha }}
          path: |
            artifacts/phase5/authorization/*.log
            artifacts/phase5/authorization/*.txt
            artifacts/phase5/authorization/report.json
            artifacts/phase5/authorization/runtime-*.json
            artifacts/phase5/authorization/runtime-*.sqlite.gz
            artifacts/phase5/authorization/unknown-*.json
            artifacts/phase5/authorization/unknown-*.sqlite.gz
            artifacts/phase5/authorization/handoff-*.json
            artifacts/phase5/authorization/handoff-*.sqlite.gz
          if-no-files-found: error
