name: phase6-wal-diagnostic
on:
  push:
    branches: [codex/diagnose-phase6-wal]
permissions:
  contents: read
jobs:
  diagnose:
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    steps:
      - name: Checkout diagnostic source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - name: Observe full durability without changing budgets
        run: sh tools/phase6/wal_diagnostic.sh "$RUNNER_TEMP/wal-diagnostic"
      - name: Retain diagnostic results including failures
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: phase6-wal-${{ github.sha }}-${{ matrix.runner }}
          path: ${{ runner.temp }}/wal-diagnostic/
          if-no-files-found: error
